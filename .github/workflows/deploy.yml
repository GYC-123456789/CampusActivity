name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: /home/ubuntu/CampusHub
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust deploy host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Sync project files
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env.prod' \
            --exclude 'CampusHubBackend/.m2/' \
            --exclude 'CampusHubBackend/target/' \
            --exclude 'CampusHubWeb/node_modules/' \
            --exclude 'CampusHubWeb/dist/' \
            --exclude 'CampusHubWeb/.vite/' \
            --exclude '**/runlogs/' \
            -e "ssh -p $DEPLOY_PORT" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Rebuild and restart services
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && sudo docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build && sudo docker compose -f docker-compose.prod.yml --env-file .env.prod ps"
